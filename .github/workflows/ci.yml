name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install source-test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Compile Python
        run: python3 -m compileall -q src scripts tests
      - name: Run network-independent tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests

  flatpak:
    name: GNOME 51 Flatpak
    runs-on: ubuntu-latest
    container:
      # Flathub's published images currently stop at GNOME 50; Builder installs
      # the GNOME 51 SDK and runtime requested by the development manifest.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Validate desktop metadata
        run: |
          glib-compile-schemas --strict --dry-run data
          appstreamcli validate --pedantic --no-net data/com.nedrichards.lewishamwalks.metainfo.xml.in
      - name: Build and test Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: Lewisham-Walks-Devel-${{ github.sha }}-x86_64.flatpak
          manifest-path: com.nedrichards.lewishamwalks.Devel.json
          cache-key: flatpak-builder-${{ github.sha }}
          run-tests: true
          keep-build-dirs: true
          upload-artifact: false

      - name: Upload development bundle
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: Lewisham-Walks-Devel-${{ github.sha }}-x86_64
          path: Lewisham-Walks-Devel-${{ github.sha }}-x86_64.flatpak
          if-no-files-found: error
          retention-days: 14
      - name: Summarize development bundle
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo '### Development Flatpak'
            echo "Download: ${ARTIFACT_URL}"
            echo "Built checkout: ${GITHUB_SHA}"
            echo "PR head: ${PR_HEAD}"
            echo 'Retention: 14 days'
            echo 'Install after extracting the artifact:'
            echo '```console'
            echo "flatpak install --user ./Lewisham-Walks-Devel-${GITHUB_SHA}-x86_64.flatpak"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Flatpak test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-test-logs-${{ github.sha }}
          path: .flatpak-builder/build/**/meson-logs/testlog.*
          if-no-files-found: warn
          retention-days: 14
