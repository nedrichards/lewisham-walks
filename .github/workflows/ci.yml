name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/ruff-action@v3
      - name: Compile Python
        run: python3 -m compileall -q src scripts tests
      - name: Run network-independent tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests

  flatpak:
    name: GNOME 50 Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Validate desktop metadata
        run: |
          glib-compile-schemas --strict --dry-run data
          appstreamcli validate --pedantic --no-net data/com.nedrichards.lewishamwalks.metainfo.xml.in
      - name: Build and test Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: lewisham-walks.flatpak
          manifest-path: com.nedrichards.lewishamwalks.Devel.json
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
