[tool.ruff]
required-version = "==0.17.1"
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
# Preview runs opt into individual rules rather than every rule in these families.
explicit-preview-rules = true
select = ["E", "F", "W", "I"]
extend-select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "EXE",
    "FURB",
    "G",
    "ISC004",
    "LOG",
    "PERF",
    "PGH003",
    "PGH004",
    "PGH005",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T100",
    "TRY201",
    "TRY203",
    "TRY400",
    "TRY401",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/capture_ui.py" = ["E402"]
"src/lewisham_walks/main.py" = ["E402"]
"src/lewisham_walks/providers/location.py" = ["PLC0415"]
"src/lewisham_walks/ui/*.py" = ["E402"]
"tests/test_ui_responsive.py" = ["PLC0415"]
