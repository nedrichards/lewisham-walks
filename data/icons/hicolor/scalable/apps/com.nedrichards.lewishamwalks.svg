<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Dark lower profile gives the map the restrained depth used by GNOME app icons. -->
  <path d="M20 27 48 18l31 10 29-10q6-2 6 6v80q0 6-5 8l-30 9-31-10-26 8q-8 2-8-7V35q0-6 6-8Z" fill="#1f7a4d"/>

  <!-- Three flat paper panels keep the folded-map metaphor legible at small sizes. -->
  <path d="M20 22 48 13v92l-27 8q-5 1-5-5V30q0-6 4-8Z" fill="#57e389"/>
  <path d="m48 13 31 10v92l-31-10Z" fill="#33d17a"/>
  <path d="m79 23 29-10q4-1 4 5v80q0 5-4 7l-29 10Z" fill="#2ec27e"/>

  <!-- The Thames anchors the abstract map in Lewisham. -->
  <path d="M17 42c14-8 24-9 34-3 12 8 20 10 30 4 11-7 19-9 31-5" fill="none" stroke="#1c71d8" stroke-width="9" stroke-linecap="round"/>
  <path d="M17 40c14-7 24-8 34-2 12 7 20 9 30 3 11-6 19-8 31-4" fill="none" stroke="#62a0ea" stroke-width="4" stroke-linecap="round"/>

  <!-- A single walk and three discoveries remain clear down to launcher size. -->
  <path d="M29 91c7-18 17-20 27-13 11 8 10-15 22-18 9-2 13 7 21-11" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="29" cy="91" r="9" fill="#813d5c"/>
  <circle cx="29" cy="91" r="4" fill="#ffffff"/>
  <circle cx="66" cy="69" r="8" fill="#f6d32d"/>
  <circle cx="66" cy="69" r="3.5" fill="#ffffff"/>
  <circle cx="99" cy="49" r="9" fill="#613583"/>
  <circle cx="99" cy="49" r="4" fill="#ffffff"/>

  <!-- Fold edges are deliberately subtle rather than decorative. -->
  <path d="M48 13v92M79 23v92" fill="none" stroke="#1f7a4d" stroke-opacity=".34" stroke-width="2"/>
</svg>
